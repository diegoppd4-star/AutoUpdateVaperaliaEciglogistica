services:
  autoupdate:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      CODEX_HOME: /codex-home
      CODEX_EXEC_PATH: codex
    volumes:
      - ./runs:/app/runs
      - ${CODEX_HOST_HOME:-/var/home/pedro/.codex}:/codex-home:ro
    command:
      - --run-name
      - docker-full-refresh
